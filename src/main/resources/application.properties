spring.application.name=cricket_score_management
server.port=8080

# MySQL Database Configuration
# Using createDatabaseIfNotExist=true so MySQL creates the cricket_score_db schema automatically
spring.datasource.url=jdbc:mysql://localhost:3306/cricket_score_db?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=root
spring.datasource.password=${DB_PASSWORD:root@skn}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA / Hibernate Configuration
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.properties.hibernate.dialect=org.hibernate.dialect.MySQLDialect
spring.jpa.open-in-view=false
